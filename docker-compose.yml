services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: marvest:latest
    container_name: marvest-app
    restart: always
    expose:
      - "8000"
    volumes:
      - ./user_data:/app/user_data
    env_file:
      - .env
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true