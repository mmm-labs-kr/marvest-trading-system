services:
  marvest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marvest-app
    restart: always
    expose:
      - "8000"
    volumes:
      - ./user_data:/app/user_data
    env_file:
      - .env
    networks:
      - kilostone-network

networks:
  kilostone-network:
    external: true
    name: kilostone-dashboard_kilostone-network