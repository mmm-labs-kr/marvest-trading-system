name: Deploy Marvest

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 필요한 파일 압축
      - name: Make Tarball
        run: |
          tar -czf project.tar.gz \
            backend \
            frontend \
            Dockerfile \
            docker-compose.yml \
            .dockerignore

      # 2. 서버로 전송
      - name: Copy Tarball to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "project.tar.gz"
          target: "/home/${{ secrets.USERNAME }}/apps/marvest-trading-system/"
          overwrite: true

      # 3. 서버에서 빌드 및 실행
      - name: Build and Run on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/apps/marvest-trading-system

            # 압축 해제
            tar -xzf project.tar.gz
            rm project.tar.gz

            # .env 파일 확인
            if [ ! -f .env ]; then
              touch .env
            fi

            echo "🚀 Building and starting marvest..."
            
            docker compose down
            docker compose up -d --build --remove-orphans
            
            # 정리
            docker image prune -f
            
            echo "✅ Done!"
            docker ps | grep marvest