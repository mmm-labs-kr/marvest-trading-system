name: Deploy Marvest (Final Fix)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 파일 누락 방지를 위해 전체 압축
      - name: Make Tarball
        run: tar -czf project.tar.gz backend frontend docker-compose.yml .dockerignore

      # 2. 압축파일을 서버로 전송 (Docker Hub 안 씀!)
      - name: Copy Tarball to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "project.tar.gz"
          # 위치를 킬로스톤 옆(apps)으로 정리
          target: "/home/${{ secrets.USERNAME }}/apps/marvest/"
          overwrite: true

      # 3. 서버에서 직접 빌드 (킬로스톤과 동일 방식)
      - name: Build and Run on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 폴더 정리 및 생성
            rm -rf /home/${{ secrets.USERNAME }}/marvest
            mkdir -p /home/${{ secrets.USERNAME }}/apps/marvest
            cd /home/${{ secrets.USERNAME }}/apps/marvest

            # 압축 해제
            tar -xzf project.tar.gz
            rm project.tar.gz

            # .env 파일 생성 (빈 파일이라도 있어야 에러 안 남)
            touch .env

            echo "🚀 Building Image on Server..."
            
            # 서버가 직접 빌드해서 실행
            docker compose down
            docker compose up -d --build --remove-orphans
            
            # 찌꺼기 정리
            docker image prune -f